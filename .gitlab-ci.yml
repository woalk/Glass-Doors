stages:
  - test
  - build
  - publish

image: mcr.microsoft.com/openjdk/jdk:25-ubuntu

cache:
  paths:
    - .gradle/caches/
    - .gradle/wrapper/
    - .gradle/loom-cache/

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

datagen:
  stage: build
  before_script:
    - apt-get update && apt-get install -y xvfb libxrender1 libxtst6 libxi6
    - export GRADLE_USER_HOME=`pwd`/.gradle
  script:
    - ./gradlew runDatagen
  artifacts:
    paths:
      - src/main/generated/
    expire_in: 10 minutes

build:
  stage: build
  needs:
    - datagen
  script:
    - ./gradlew build
  artifacts:
    paths:
      - build/libs/glass_doors-*.jar
  rules:
    - if: $CI_COMMIT_TAG || $CI_PIPELINE_SOURCE == "push"

modrinth:
  stage: publish
  needs:
    - build
    - datagen
  script:
    - ./gradlew modrinth
  rules:
    - if: $CI_COMMIT_TAG && $MODRINTH_TOKEN
